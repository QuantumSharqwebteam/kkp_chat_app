plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}
// 🔐 Load keystore values from keys.env
def keystorePropertiesFile = rootProject.file("../keys.env")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}


android {
    namespace = "com.kkptextile.kkpchatapp"
    compileSdk = 36
    ndkVersion = "28.2.13676358"//"25.1.8937393"
    //flutter.ndkVersion // 26.1.10909125

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
       
        applicationId = "com.kkptextile.kkpchatapp"
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = 36
        versionCode = 58
        versionName = "1.5.8" 
        ndk {
             abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

   signingConfigs {
        release {
           storeFile rootProject.file(keystoreProperties['KEYSTORE_PATH'])
            storePassword keystoreProperties['KEYSTORE_STORE_PASSWORD']
            keyAlias keystoreProperties['KEY_ALIAS']
            keyPassword keystoreProperties['KEY_PASSWORD']
        }
    }


    buildTypes {
        release {
        
            // Signing with the debug keys for now, so flutter run --release works.
            signingConfig signingConfigs.release
            minifyEnabled true // <- Enable ProGuard
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
   coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
   implementation 'com.google.android.material:material:1.11.0'
